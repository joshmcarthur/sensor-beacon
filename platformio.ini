; sensor-beacon — MeshCore out-of-tree beacon firmware

[platformio]
extra_configs =
  platformio.local.ini

[beacon_secrets]
build_flags =
  -D BEACON_NODE_NAME='"beacon"'
  -D BEACON_CHANNEL_PSK='"00000000000000000000000000000000"'

[arduino_base]
framework = arduino
monitor_speed = 115200
extra_scripts =
  pre:pre_build.py
  post:create_uf2.py
lib_deps =
  MeshCore=https://github.com/meshcore-dev/MeshCore.git#main
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/DHT sensor library @ ^1.4.6
  closedcube/ClosedCube OPT3001 @ ^1.1.2
  adafruit/Adafruit LTR390 Library @ ^1.1.2
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  ; Match your main node's radio params exactly (freq/bw/sf/cr must all align)
  -D LORA_FREQ=917.375
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
build_src_filter = +<*>

[beacon_app]
build_src_filter = ${arduino_base.build_src_filter}
  +<../examples/sensor_beacon/>

[env:xiao_sensor_beacon]
extends = arduino_base
platform = nordicnrf52
platform_packages =
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
board = seeed-xiao-afruitnrf52-nrf52840
board_build.variants_dir = variant
board_build.variant = Seeed_XIAO_nRF52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
upload_protocol = nrfutil
debug_tool = jlink
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/oltaco/CustomLFS#0.2.2
build_flags = ${arduino_base.build_flags}
  -D NRF52_PLATFORM
  -D MC_VARIANT=xiao_nrf52
  -D NRF52_POWER_MANAGEMENT
  -D XIAO_NRF52
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=11
  -D P_LORA_DIO_1=D1
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
  -D SX126X_RXEN=D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_WIRE_SCL=D6
  -D PIN_WIRE_SDA=D7
  ; Optional 1-wire DHT22 on a free GPIO (data pin; many modules include a 10k pull-up):
  ; -D DHT22_PIN=D0
  -D PIN_USER_BTN=PIN_BUTTON1
  -D DISPLAY_CLASS=NullDisplayDriver
  -D BEACON_INTERVAL_SECS=300
  -D BEACON_SEND_COUNT=3
  ${beacon_secrets.build_flags}
build_src_filter = ${beacon_app.build_src_filter}

; Bare RAK3172-T (STM32WLE5 + onboard SX126x, TCXO). I2C on PA11/PA12. UART2 PA2/PA3.
; Flash: BOOT0 high, then `pio run -e rak3172_sensor_beacon -t upload` (serial).
; ST-Link: add `upload_protocol = stlink` in platformio.local.ini.
[env:rak3172_sensor_beacon]
extends = arduino_base
platform = ststm32
board = rak3172
board_upload.maximum_size = 229376
upload_protocol = serial
debug_tool = stlink
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/stm32duino/STM32LowPower.git#1.5.0
  https://github.com/stm32duino/STM32RTC.git#1.9.0
  SubGhz
build_flags = ${arduino_base.build_flags}
  -D STM32_PLATFORM
  -D RAK_3X72
  -D MC_VARIANT=rak3x72
  -D RADIO_CLASS=CustomSTM32WLx
  -D WRAPPER_CLASS=CustomSTM32WLxWrapper
  -D RX_BOOSTED_GAIN=true
  -D LORA_TX_POWER=22
  ; RAK3172 (XTAL) uses 0. RAK3172-T / TI / T1 (TCXO) needs 3.0 — RadioLib -707 is this mismatch.
  -D STM32WL_TCXO_VOLTAGE=3.0
  -D BEACON_HAS_VBAT=0
  -D BEACON_INTERVAL_SECS=900
  -D BEACON_SEND_COUNT=3
  ; Factory AT UART is USART2 on PA2/PA3 (AF7). STM32duino default Serial is LPUART1 on the same pins.
  -D SERIAL_UART_INSTANCE=2
  -D PIN_SERIAL_TX=PA2_ALT1
  -D PIN_SERIAL_RX=PA3_ALT1
  -Wl,-u,_printf_float
  ${beacon_secrets.build_flags}
build_src_filter = ${beacon_app.build_src_filter}
